[build]
  publish = "."

[[redirects]]
  from = "/services"
  to = "/services.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms-of-service.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/operations"
  to = "https://novelty-corporate-control.netlify.app/savannah"
  status = 302
  force = true

[[redirects]]
  from = "/benefitwatch"
  to = "/benefitwatch.html"
  status = 200

[[redirects]]
  from = "/unclaimed-benefits-namibia"
  to = "/unclaimed-benefits-namibia.html"
  status = 200

[[redirects]]
  from = "/beneficiary-tracing-namibia"
  to = "/beneficiary-tracing-namibia.html"
  status = 200

[[redirects]]
  from = "/pension-benefit-tracing-namibia"
  to = "/pension-benefit-tracing-namibia.html"
  status = 200

[[redirects]]
  from = "/insurance-benefit-recovery-namibia"
  to = "/insurance-benefit-recovery-namibia.html"
  status = 200

[[redirects]]
  from = "/next-of-kin-tracing-namibia"
  to = "/next-of-kin-tracing-namibia.html"
  status = 200

[[redirects]]
  from = "/institutional-tracing"
  to = "/institutional-tracing.html"
  status = 200

[[redirects]]
  from = "/recovery-services"
  to = "/recovery-services.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
